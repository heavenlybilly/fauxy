name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            node_modules/

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure npm authentication
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: Determine release tag
        id: tag
        run: |
          TAG="latest"
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == *"alpha"* ]]; then TAG="alpha"; fi
          if [[ "$REF" == *"beta"* ]]; then TAG="beta"; fi
          if [[ "$REF" == *"rc"* ]]; then TAG="rc"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --tag ${{ steps.tag.outputs.tag }}